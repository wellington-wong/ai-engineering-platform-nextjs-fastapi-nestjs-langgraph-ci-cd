<script>
    customElements.whenDefined('n8n-demo').then(() => {
        const el = document.querySelector('n8n-demo');

        const stretch = () => {
            const iframe = el.shadowRoot && el.shadowRoot.querySelector('iframe');
            if (!iframe) return false;

            // Set the iframe and every ancestor up to the shadow root to full size


            let node = iframe;
            while (node && node !== el.shadowRoot) {
                node.style.setProperty('height', '100%', 'important');
                node.style.setProperty('width', '100%', 'important');
                node.style.setProperty('border', '0');
                node = node.parentNode;
            }
            return true;

        };

        // The iframe is rendered asynchronously, so retry until it exists
        if (!stretch()) {
            const timer = setInterval(() => { if (stretch()) clearInterval(timer); }, 100);
            setTimeout(() => clearInterval(timer), 5000);
        }
    });
</script>
